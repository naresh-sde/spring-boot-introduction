# ===== Application =====
spring.application.name=customer-service

# ===== Server =====
server.port=8080

# ===== Profiles =====
# The dev profile is defined in application-dev.properties.
spring.profiles.active=dev

# ===== Custom app properties (bound to AppProperties) =====
app.name=Customer Management Service
app.version=1.0.0
app.contact.email=support@naresh.example
app.features.auto-approve=true

# ===== Logging =====
logging.level.root=INFO
logging.level.com.naresh.introduction=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
